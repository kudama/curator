name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q curator
      - run: node --check curator/static/seerr-connections.js
      - run: node --check curator/static/client-compat.js
      - run: node --check curator/static/metadata-manager.js
      - run: node --check curator/static/artwork-manager.js
      - run: node --check curator/static/artwork-editors.js
      - run: node --check curator/static/mage-settings.js
      - run: node --check curator/static/refresh.js
      - run: node --check curator/static/app.js
      - run: node --check curator/static/workbench.js
      - run: node --check curator/static/queue-board.js
      - run: node --check curator/static/file-management.js
      - run: node --check curator/static/collections.js
      - run: node --test tests/test_*.js
  python-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.5
      - run: ruff check curator tests
      - run: ruff format --check curator tests
