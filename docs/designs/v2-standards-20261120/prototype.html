<style>

<script>

function typePage(main){
 const kind=view.kind,rec=server.types[kind],libs=libsOf(kind),overriding=libs.filter(l=>Object.keys(l.overrides).length);
 main.append(h('div',{class:'sub'},'STANDARD FOR PLEX ',LABELS[kind].toUpperCase(),' LIBRARIES'),h('h1',{},LABELS[kind]),
  h('div',{class:'meta'},h('span',{},'Revision ',h('b',{},String(rec.revision))),h('span',{},JSON.stringify(rec.values)===JSON.stringify(DEFAULTS[kind])?'Curator defaults':'Customized'),h('span',{},'Used by ',h('b',{},libs.map(l=>l.title).join(', ')||'no libraries')),overriding.length?h('span',{},overriding.length+' with overrides'):null),
  h('p',{class:'sub'},'What done means for every '+LABELS[kind]+' library. A standard describes the result you want; it never starts processing, publishing or paid work on its own.'));

}

  h('div',{class:'meta'},h('span',{},'Inherits from ',h('button',{class:'link',onclick:()=>go({page:'type',kind})},LABELS[kind]+' standard'),' (revision '+server.types[kind].revision+')'),h('span',{},'Overrides revision ',h('b',{},String(lib.revision))),h('span',{},h('b',{},String(count)),count===1?' field overridden':' fields overridden')),

  main.append(h('section',{class:'panel'},h('h2',{},'Review changes before saving'),h('p',{class:'sub'},view.page==='type'?'Saving creates revision '+(server.types[view.kind].revision+1)+'. It applies to '+reach.length+' librar'+(reach.length===1?'y':'ies')+' except where a library overrides that field. Nothing is processed or published by saving.':'Saving creates override revision '+(lib.revision+1)+' for '+lib.title+' only. Nothing is processed or published by saving.'),
   h('table',{},h('thead',{},h('tr',{},h('th',{},'Field'),h('th',{},'Before'),h('th',{},'After'),view.page==='type'?h('th',{},'Libraries affected'):h('th',{},'Source'))),h('tbody',{},...rows.map(r=>h('tr',{},h('td',{},label(r.d,r.f)),h('td',{class:'old'},show(r.before,specOf(r.d,r.f))),h('td',{class:'new'},show(r.after,specOf(r.d,r.f))),
    view.page==='type'?h('td',{},(()=>{const hit=reach.filter(l=>!(l.overrides[r.d]&&r.f in l.overrides[r.d]));const skip=reach.length-hit.length;return (hit.map(l=>l.title).join(', ')||'None')+(skip?' · '+skip+' keep their override':'');})()):h('td',{},r.inherit?'Inherited from '+LABELS[lib.kind]:'Override')))))));}
}
function actions(main,extra){
 const d=dirty(),valid=!Object.keys(errors).length;
 const status=phase==='review'?'Check the changes, then save.':!d?'No unsaved changes.':!valid?'Fix the highlighted field before reviewing.':changes().length+' unsaved change'+(changes().length===1?'':'s');
 main.append(h('div',{class:'actions'},h('span',{class:'status'},status),extra,
  phase==='review'?h('button',{onclick:()=>{phase='edit';render();}},'Back to editing'):h('button',{class:'subtle',disabled:!d,onclick:()=>{draft=clone(base);errors={};message=null;render();}},'Discard changes'),
  phase==='review'?h('button',{class:'primary',onclick:save},'Save '+(view.page==='type'?LABELS[view.kind]+' standard':'overrides')):h('button',{class:'primary',disabled:!valid,onclick:review},'Review changes')));
 main.append(h('p',{class:'note'},'Prototype for issue #105 with synthetic libraries and values. Saving maps to POST /api/standards or POST /api/library/standard with the current revision. Scans, completion and processing do not read standards yet; that is #107.'));
}
function review(){if(!validate()){render();return;}if(!changes().length){message=()=>h('div',{class:'banner info'},h('p',{},'Nothing changed, so there is nothing to save. The standard stays at revision '+(view.page==='type'?server.types[view.kind].revision:currentLib().revision)+'.'));render();return;}phase='review';message=null;render();}
function save(){
 if(scenario==='conflict'){message=()=>h('div',{class:'banner warn'},h('p',{},h('b',{},'This standard changed in another window.'),' Revision 4 was saved after you opened revision 3. Your edits are still here and nothing was saved. Reload revision 4 to see what changed, then reapply your edits and review again.'),h('button',{onclick:()=>{message=null;phase='edit';render();}},'Reload revision 4'));phase='edit';render();return;}
 if(view.page==='type'){server.types[view.kind]={revision:server.types[view.kind].revision+1,values:clone(draft)};}else{const lib=currentLib();lib.overrides=clone(draft);lib.revision++;}
 load();message=()=>h('div',{class:'banner ok'},h('p',{},'Saved. '+(view.page==='type'?LABELS[view.kind]+' standard is now revision '+server.types[view.kind].revision+'.':currentLib().title+' overrides are now revision '+currentLib().revision+'.')+' No processing was started.'));render();
}
function render(){renderNav();const main=document.getElementById('main');main.replaceChildren();(view.page==='type'?typePage:libPage)(main);}
// ---- Scenarios for the recorded renders (#s=...) ----
const S={
 type:()=>{view={page:'type',kind:'movie'};load();},
 library:()=>{view={page:'lib',lib:'lib-family'};load();},
 unsaved:()=>{view={page:'type',kind:'movie'};load();draft.cast.enabled=true;draft.upscaling.target='2160';},
 review:()=>{view={page:'type',kind:'movie'};load();draft.cast.enabled=true;draft.upscaling.target='2160';draft.encoding.max_mbps_1080=null;phase='review';},
 libreview:()=>{view={page:'lib',lib:'lib-films'};load();delete draft.artwork;draft.metadata={required:['summary','year','genres','content_rating']};phase='review';},
 noop:()=>{view={page:'type',kind:'show'};load();review();},
 error:()=>{view={page:'lib',lib:'lib-family'};load();draft.encoding.max_mbps_1080=0;validate();},
 conflict:()=>{view={page:'type',kind:'movie'};load();draft.metadata.required=['summary','year','genres','studio'];phase='review';save();},
 leave:()=>{view={page:'type',kind:'movie'};load();draft.cast.enabled=true;},
};
(S[scenario]||S.type)();render();
if(scenario==='leave')go({page:'lib',lib:'lib-kids'});
</script></body></html>
