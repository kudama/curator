<style>

<header><div class="brand"><div class="mark">C</div><strong>CURATOR</strong></div><nav class="tabs"><span>Home</span><span class="on">Library Manager</span><span>History</span><span>Configuration</span></nav><span class="proto">PROTOTYPE · SYNTHETIC DATA</span></header>
<div class="wb" id="wb"></div>

<script>

  h('fieldset',{},h('legend',{},'Scope'),opt('scope','5 selected files',true,'Exactly the files selected in the list'),opt('scope','Folder: Sample Film 31 (2024)',false,'Every video under this folder'),opt('scope','Whole library: Synthetic Films (140 files)',false,'Large plans are summarised; every item can be expanded')),
  h('fieldset',{},h('legend',{},'Existing files'),opt('policy','Create missing files only (default)',true,'Existing NFO and image files are kept untouched'),opt('policy','Also propose updates to Curator-written NFO files',false,'Each update is shown as a difference and must be approved one by one; an update you do not approve is left out. The previous file is retained. Files written by other tools are never updated here.')),
  h('fieldset',{},h('legend',{},'Include'),opt('inc','NFO metadata',true,'Current Plex metadata, including edits you saved in Curator: title, description, dates, studio, genres, verified IDs, ratings with their source, credits and cast',true),opt('inc','Every available supported image',true,'The current Plex selection, or artwork you explicitly saved in Curator, beside the video using Plex names. Each image shows its source. Missing kinds are reported, never generated.',true)),
  h('p',{class:'muted'},'Planning reads Plex and your files only. Nothing is written until you approve, and Plex is not refreshed or switched to another agent.')),

function opt(name,text,checked,sub,locked){return h('label',{class:'opt'},h('input',{type:name==='inc'?'checkbox':'radio',name,checked,disabled:locked}),h('span',{},text,h('small',{},sub)));}
function itemCard(it,open){
 const n=nfoState(it),c=h('section',{class:'item'},h('div',{class:'top'},h('b',{},it.title),tag(tagClass[n]||n,'NFO: '+labels[n])));

 t.append(h('tr',{},h('td',{},'Video'),h('td',{},h('span',{class:'path'},it.folder+it.video))));
 if(it.multipart){t.append(h('tr',{},h('td',{},'Reason'),h('td',{},'Multi-part movie (pt1, pt2): the Plex NFO agent does not support split files. Skipped; nothing is written.')));c.append(t);return c;}
 if(it.shared){t.append(h('tr',{},h('td',{},'Reason'),h('td',{},'Shared folder with 6 videos. A generic poster.jpg would apply to all of them. Needs basename-prefixed names; association must be confirmed before this item can be planned.')));}
 if(it.third){t.append(h('tr',{},h('td',{},'NFO'),h('td',{},'An NFO written by another tool exists. It is kept as it is and never overwritten from here, under either policy.')));}
 else if(n==='kept')t.append(h('tr',{},h('td',{},'NFO'),h('td',{},h('span',{class:'path'},it.folder+it.nfo[1]),h('div',{class:'muted'},'A Curator-written NFO exists and is kept as it is under the create-missing policy. Choose “Also propose updates” to review changes to it.'))));
 else if(!it.shared)t.append(h('tr',{},h('td',{},'NFO'),h('td',{},h('span',{class:'path'},it.folder+it.nfo[1]),n==='excluded'||n==='proposed'?h('div',{class:'muted'},'Not approved, so it is left out of the export. The existing file stays as it is.'):null)));

  h('span',{class:'keep'},'  <title>Sample Film 40</title>\n'),h('span',{class:'del'},'- <plot>A short synthetic description.</plot>\n'),h('span',{class:'add'},'+ <plot>A longer synthetic description edited in Curator.</plot>\n'),h('span',{class:'add'},'+ <premiered>2023-04-12</premiered>\n'),h('span',{class:'keep'},'  <custom:tag>kept unknown element</custom:tag>\n')),
  h('p',{class:'muted'},'Unknown elements are preserved. The previous file is retained before replacement.'),
  h('label',{class:'opt'},h('input',{type:'checkbox',checked:APPROVED}),h('span',{},'Approve this update',h('small',{},APPROVED?'Approved: included in the export and in the counts above.':'Not approved: excluded from the export and from the counts above. Tick to include it.')))));
